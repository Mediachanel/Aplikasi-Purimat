version: '3.8'

# Database = Google Spreadsheet, berkas privat = Google Drive (tidak ada container PostgreSQL).
services:
  purimas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purimas-api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET wajib diisi}
      - DB_MODE=sheets
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:?GOOGLE_SPREADSHEET_ID wajib diisi}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REFRESH_TOKEN=${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      - GOOGLE_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY:-}
    # Beri waktu menyimpan perubahan terakhir ke spreadsheet saat container dihentikan.
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
